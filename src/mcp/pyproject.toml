[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abw-mcp"
version = "0.1.0"
description = "Agents Behind the Wall MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-core>=1.35.1",
  "azure-cosmos>=4.14.0",
  "azure-identity>=1.25.1",
  "azure-monitor-opentelemetry>=1.8.2",
  "azure-search-documents>=11.6.0",
  "azure-storage-blob>=12.26.0",
  "httpx>=0.28.1",
  "mcp>=2.3.0",
  "msal>=1.39.0",
  "opentelemetry-instrumentation-asgi>=0.59b0",
  "PyJWT>=2.10.1",
  "requests>=2.32.5",
  "starlette>=0.48.0",
  "uvicorn>=0.38.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
]

[tool.setuptools]
packages = ["abw_mcp", "abw_mcp.servers"]

